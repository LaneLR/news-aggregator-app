name: CI

# Runs lint + a production build on every push and PR so broken code shows
# up as a failed check (on the commit, and on the PR alongside Vercel's own
# preview-deployment status) before it ever reaches main/production —
# there was previously no CI configured at all, which is why nothing showed
# up as a "check" next to Vercel's deployments.
on:
  # No branch filter on push — work happens directly on dev/LaneR (and other
  # branches), not just main, and Vercel already deploys a preview for every
  # one of those pushes; this check should show up right next to that
  # preview, not only on main.
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # No DATABASE_URL/Stripe/etc. secrets on purpose — DB access in this
      # app happens lazily inside request handlers (see src/lib/sequelize.js),
      # not at build time, so `next build` doesn't need them. Sentry's build
      # plugin (next.config.js) also degrades gracefully without its auth
      # token, just skipping the source-map upload step.
      - run: npm run build
